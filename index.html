<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Undiyal…</title>
<meta name="description" content="Undiyal – a private, offline family finance and records tracker.">
<meta http-equiv="refresh" content="0;url=Undiyal.html">
<script>location.replace('Undiyal.html' + location.search + location.hash);</script>
<link rel="icon" href="logo/undiyal-icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#f3f6f4;--card:#fff;--tx:#15201c;--mut:#5b6b65;--c0:#0b7a5e;--c1:#2aa37f}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1513;--card:#18201d;--tx:#e4ece8;--mut:#9aaba4;--c0:#2aa37f;--c1:#5cc9a3}}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--bg);color:var(--tx);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .box{text-align:center;padding:36px 28px;max-width:380px;width:calc(100% - 32px);background:var(--card);
       border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
  .spin{position:relative;width:120px;height:120px;margin:0 auto 18px}
  .ring{position:absolute;inset:0;border-radius:50%;
        background:conic-gradient(from 0deg,transparent 0 20%,var(--c1) 55%,var(--c0) 100%);
        -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
                mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
        animation:turn 1s linear infinite}
  .pot{position:absolute;left:50%;top:50%;width:66px;height:66px;transform:translate(-50%,-50%)}
  .pot .coin{transform-box:fill-box;transform-origin:center;animation:bob 1.2s ease-in-out infinite}
  @keyframes turn{to{transform:rotate(360deg)}}
  @keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(2px)}}
  h1{font-size:20px;margin:0 0 6px;color:var(--c0)}
  p{margin:4px 0;color:var(--mut);line-height:1.5;font-size:14px}
  a{color:var(--c0)}
  @media (prefers-reduced-motion:reduce){.ring,.pot .coin{animation:none}}
</style>
</head>
<body>
  <main class="box" role="status" aria-live="polite">
    <div class="spin" aria-hidden="true">
      <div class="ring"></div>
      <svg class="pot" xmlns="http://www.w3.org/2000/svg" viewBox="4 2.5 56 56">
        <g class="coin"><g transform="rotate(-18 41 11)">
          <circle cx="41" cy="11" r="7.5" fill="#E2A72E"/>
          <circle cx="41" cy="11" r="5.2" fill="none" stroke="#B87F12" stroke-width="1.4"/>
        </g></g>
        <rect x="27" y="14.5" width="10" height="6" rx="3" fill="#0B6E57"/>
        <path d="M32 19c-10.5 0-18.5 6.8-18.5 17.3C13.5 47.5 21.6 56 32 56s18.5-8.5 18.5-19.7C50.5 25.8 42.5 19 32 19z" fill="#0B6E57"/>
        <rect x="35.5" y="22.6" width="9" height="2.8" rx="1.4" transform="rotate(-18 40 24)" fill="#F3F6F4"/>
        <path d="M15.2 38.5c5.2 2.6 11 3.9 16.8 3.9s11.6-1.3 16.8-3.9" fill="none" stroke="#3CC49D" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="24" y="54.5" width="16" height="3.5" rx="1.75" fill="#08503F"/>
      </svg>
    </div>
    <h1>Opening Undiyal…</h1>
    <p>Your private family finance and records tracker.</p>
    <p>If nothing happens, <a href="Undiyal.html">open it here</a>.</p>
  </main>
</body>
</html>
